name: filter
# Target: Roihu GPU partition (NVIDIA GH200, aarch64).
# Build on roihu-gpu.csc.fi, not on the x86 CPU login node.
channels:
  - conda-forge          # Miniforge default; has aarch64 CUDA builds of PyTorch
  - nodefaults           # keep Anaconda "defaults" out of the solve
dependencies:
  - python=3.12
  - cuda-version>=12,<13 # H100 needs CUDA 12; pins the whole CUDA stack consistently
  - pytorch-gpu          # conda-forge CUDA build of PyTorch
  - faiss-gpu            # if unsolvable on aarch64, replace with faiss-cpu (see notes)
  - numpy
  - scipy
  - pandas
  - geopandas
  - lxml
  - csvkit
  - jq                   # used by the polygon_to_place and runoregi_pages rules
  - tqdm
  - pip
  - pip:
    - git+https://github.com/hsci-r/shortsim
    - git+https://github.com/maciejjan/matrix-align
